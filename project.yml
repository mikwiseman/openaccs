name: OpenAccs
options:
  bundleIdPrefix: is.wai
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  OpenAccsKit:
    path: Packages/OpenAccsKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # Sparkle 2.10.0, pinned to the published immutable commit.
    revision: eef1a539a373c1f1a320624b1130fc5de7b2e100
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Local builds sign to run on this Mac; scripts/release.sh signs with Developer ID and notarizes.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.3.3"
targets:
  OpenAccs:
    type: application
    platform: macOS
    sources: [OpenAccs]
    dependencies:
      - package: OpenAccsKit
        product: OpenAccsCore
      - package: OpenAccsKit
        product: ClaudeKit
      - package: OpenAccsKit
        product: CodexKit
      - package: OpenAccsKit
        product: LimitsKit
      - package: Sparkle
    info:
      path: OpenAccs/Info.plist
      properties:
        CFBundleDisplayName: OpenAccs
        CFBundleName: OpenAccs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Sparkle compares this: the version itself, so every release is newer than the last.
        CFBundleVersion: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Mik Wiseman"
        # Sparkle: a signed feed on GitHub Pages (docs/appcast.xml). The private key is in 1Password,
        # Development / "OpenAccs Sparkle EdDSA private key"; scripts/release.sh signs with it.
        SUFeedURL: https://mikwiseman.github.io/openaccs/appcast.xml
        SUPublicEDKey: vgOpSM+ASntxre/dvwwujiPIdnw5UCUjUgDyrHlmOsU=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: false
        SUSendProfileInfo: false
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: is.wai.openaccs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: ""
